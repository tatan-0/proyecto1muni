{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resumen SGR · La Serena</title>
    <link rel="stylesheet" href="{% static 'gestion/css/styles.css' %}">
</head>
<body class="min-h-screen bg-base-200 text-base-content">
    <main class="mx-auto max-w-5xl px-4 py-10 sm:px-8">
        <section class="card card-border bg-base-100 shadow-sm">
            <div class="card-body">
                <h1 class="card-title text-3xl">Resumen de gestión</h1>
                <p>Vista inicial. Datos de demostración.</p>
                <ul class="list-disc pl-6">
                    {% for funcionario in funcionarios %}<li>{{ funcionario.nombre }} — {{ funcionario.delegacion.nombre }}</li>{% empty %}<li>No hay funcionarios para mostrar.</li>{% endfor %}
                </ul>
            </div>
        </section>
    </main>
</body>
</html>
